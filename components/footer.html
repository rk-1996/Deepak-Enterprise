<script>
  // Year
  document.getElementById('year').textContent = new Date().getFullYear();

  // Smooth scroll + active nav
  const navLinks = document.querySelectorAll('.nav-link');
  const sections = document.querySelectorAll('section[id]');

  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      const href = link.getAttribute('href');
      if (href.startsWith('#')) {
        e.preventDefault();
        document.querySelector(href).scrollIntoView({behavior: 'smooth'});
      }
    });
  });

  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(sec => {
      const offset = sec.offsetTop - 120;
      const height = sec.offsetHeight;
      if (window.scrollY >= offset && window.scrollY < offset + height) {
        current = sec.id;
      }
    });
    navLinks.forEach(link => {
      link.classList.toggle('active', link.getAttribute('href') === '#' + current);
    });
  });

  // WhatsApp tooltip show briefly on load
  const tip = document.getElementById('waTip');
  setTimeout(() => {
    tip.classList.add('show');
    setTimeout(() => tip.classList.remove('show'), 2500);
  }, 1200);
</script>

<script>
  // existing JS (year, nav, tooltip, etc.) stays above

  // ---- IMAGE PREVIEW LOGIC ----
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('imageModalImg');
  const modalCaption = document.getElementById('imageModalCaption');
  const modalClose = document.getElementById('imageModalClose');

  function openImageModal(src, caption) {
    modalImg.src = src;
    modalCaption.textContent = caption || '';
    modal.classList.add('open');
  }

  function closeImageModal() {
    modal.classList.remove('open');
    modalImg.src = '';
    modalCaption.textContent = '';
  }

  // attach click listeners to all previewable images
  document.querySelectorAll('.preview-img').forEach(img => {
    img.addEventListener('click', () => {
      const src = img.getAttribute('src');
      const caption = img.getAttribute('data-caption') || img.getAttribute('alt');
      openImageModal(src, caption);
    });
  });

  // close actions
  modalClose.addEventListener('click', closeImageModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeImageModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      closeImageModal();
    }
  });
</script>

<script>

const hamburger=document.getElementById("hamburger");

const sideMenu=document.getElementById("sideMenu");

const overlay=document.getElementById("overlay");

const closeMenu=document.getElementById("closeMenu");

function openMenu(){

sideMenu.classList.add("open");

overlay.classList.add("show");

hamburger.classList.add("active");

document.body.style.overflow="hidden";

}

function hideMenu(){

sideMenu.classList.remove("open");

overlay.classList.remove("show");

hamburger.classList.remove("active");

document.body.style.overflow="";

}

hamburger.addEventListener("click",openMenu);

closeMenu.addEventListener("click",hideMenu);

overlay.addEventListener("click",hideMenu);

document.querySelectorAll(".side-menu a").forEach(link=>{

link.addEventListener("click",hideMenu);

});

</script>
<script>
    const slides = document.querySelectorAll(".slide");
const dotsContainer = document.querySelector(".dots");
const next = document.querySelector(".next");
const prev = document.querySelector(".prev");

let index = 0;

slides.forEach((slide,i)=>{
    const dot=document.createElement("span");
    dot.classList.add("dot");
    if(i===0) dot.classList.add("active");

    dot.addEventListener("click",()=>{
        showSlide(i);
    });

    dotsContainer.appendChild(dot);
});

const dots=document.querySelectorAll(".dot");

function showSlide(i){

slides[index].classList.remove("active");
dots[index].classList.remove("active");

index=i;

if(index>=slides.length) index=0;
if(index<0) index=slides.length-1;

slides[index].classList.add("active");
dots[index].classList.add("active");

}

next.onclick=()=>showSlide(index+1);
prev.onclick=()=>showSlide(index-1);

setInterval(()=>{
showSlide(index+1);
},6000);
</script>
<script>
  const scrollTopBtn = document.getElementById('scrollTopBtn');
  let pulsePlayed = false;

  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      if (!scrollTopBtn.classList.contains('show')) {
        scrollTopBtn.classList.add('show');

        // Play pulse animation only once
        if (!pulsePlayed) {
          scrollTopBtn.classList.add('pulse');
          pulsePlayed = true;

          // Remove pulse class after animation ends
          setTimeout(() => {
            scrollTopBtn.classList.remove('pulse');
          }, 3500);
        }
      }
    } else {
      scrollTopBtn.classList.remove('show');
    }
  });

  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });
</script>

    mobileMenu.classList.remove('open');
    menuOverlay.classList.remove('open');

  menuToggle.addEventListener('click', openMenu);
  menuClose.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', closeMenu);

  // Close menu on link click
  document.querySelectorAll('.mobile-menu a').forEach(link => {
    link.addEventListener('click', closeMenu);
  });
</script>

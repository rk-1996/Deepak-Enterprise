
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | Deepak Enterprise</title>

  <meta name="description"
    content="Explore brass electrical components, brass inserts, hinges and tower bolts manufactured by Deepak Enterprise.">

  <link rel="stylesheet" href="assets/css/index.css">

  <style>
    .catalogue {
      max-width: 1200px;
      margin: auto;
      padding: 50px 20px;
    }

    .catalogue-hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .catalogue-hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .catalogue-hero p {
      color: #666;
    }

    .catalogue-tools {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .catalogue-tools input,
    .catalogue-tools select {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    .catalogue-tools input {
      flex: 1;
      min-width: 220px;
    }

    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .catalogue-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .catalogue-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f6f6f6;
    }

    .catalogue-card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .catalogue-card h3 {
      font-size: 18px;
      margin: 8px 0;
    }

    .catalogue-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .catalogue-category {
      color: #b78a3d;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .catalogue-specs {
      color: #555;
      font-size: 13px;
      margin: 10px 0 18px;
    }

    .catalogue-btn {
      display: inline-block;
      padding: 12px;
      text-align: center;
      border-radius: 6px;
      background: #b78a3d;
      color: white;
      font-weight: bold;
      text-decoration: none;
      margin-top: auto;
    }

    .catalogue-btn:hover {
      background: #946d2c;
    }

    .catalogue-empty {
      display: none;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 900px) {
      .catalogue-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .catalogue {
        padding: 30px 15px;
      }

      .catalogue-hero h1 {
        font-size: 30px;
      }

      .catalogue-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .catalogue-card img {
        height: 140px;
      }

      .catalogue-card-body {
        padding: 12px;
      }

      .catalogue-card h3 {
        font-size: 15px;
      }

      .catalogue-card p {
        font-size: 13px;
      }

      .catalogue-btn {
        font-size: 12px;
        padding: 10px;
      }
    }

    @media (max-width: 380px) {
      .catalogue-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>
  <!-- Use your existing header here -->

  <main class="catalogue">

    <section class="catalogue-hero">
      <h1>Our Products</h1>
      <p>
        Brass Electrical Components, Inserts & Hardware
      </p>
      <p>
        OEM Manufacturing · Custom Components · Export Supply
      </p>
    </section>

    <div class="catalogue-tools">
      <input
        type="search"
        id="productSearch"
        placeholder="Search products..."
        aria-label="Search products">

      <select id="productCategory" aria-label="Filter products">
        <option value="all">All Categories</option>
        <option value="electrical">Electrical Parts</option>
        <option value="inserts">Brass Inserts</option>
        <option value="hardware">Hardware</option>
        <option value="custom">Custom Parts</option>
      </select>
    </div>

    <div
      class="catalogue-grid"
      id="productGrid">
    </div>

    <p
      class="catalogue-empty"
      id="catalogueEmpty">
      No products found.
    </p>

  </main>

  <!-- Reusable Footer -->
  <div id="site-footer"></div>


  <!-- Reusable components -->
  <script src="assets/js/components.js"></script>

  <script src="assets/js/products.js"></script>

  <script>
    const productGrid = document.getElementById("productGrid");
    const productSearch = document.getElementById("productSearch");
    const productCategory = document.getElementById("productCategory");
    const catalogueEmpty = document.getElementById("catalogueEmpty");
    const urlParams = new URLSearchParams(window.location.search);
    const urlCategory = urlParams.get("category");

    if (urlCategory) {
      productCategory.value = urlCategory;
      renderProducts();
    }
    function renderProducts() {
      const searchTerm = productSearch.value.toLowerCase();
      const selectedCategory = productCategory.value;

      const filteredProducts = products.filter(product => {
        const text = (
          product.name + " " +
          product.description + " " +
          product.specs
        ).toLowerCase();

        const matchesSearch = text.includes(searchTerm);

        const matchesCategory =
          selectedCategory === "all" ||
          product.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      productGrid.innerHTML = filteredProducts.map(product => `
        <article class="catalogue-card">

          <img
            src="assets/images/products/${product.image}"
            alt="${product.name}"
            loading="lazy"
            onerror="this.onerror=null;this.src='assets/images/products/placeholder.jpg';">

          <div class="catalogue-card-body">

            <div class="catalogue-category">
              ${product.category}
            </div>

            <h3>${product.name}</h3>

            <p>${product.description}</p>

            <div class="catalogue-specs">
              ${product.specs}
            </div>

            <a
              class="catalogue-btn"
              href="product-details.html?id=${product.id}">
              View Product
            </a>

          </div>
        </article>
      `).join("");

      catalogueEmpty.style.display =
        filteredProducts.length ? "none" : "block";
    }

    productSearch.addEventListener("input", renderProducts);
    productCategory.addEventListener("change", renderProducts);

    renderProducts();
  </script>

</body>
</html>
